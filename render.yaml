# Render Blueprint for the river solver (M2). Deploy: push this repo, then in
# the Render dashboard "New +" -> "Blueprint" and point it at this repo. Render
# builds the Dockerfile and gives an HTTPS URL. Paid tiers are always-on (no
# cold start), so no prewarm is needed.
#
# TIER: `starter` (0.5 vCPU / 512 MB, ~$7/mo). Solves run ~2x slower than the
# benchmarked 1-vCPU times, so deep spots hit the 60s backstop sooner; a
# max-size tree (~200 MB peak) sits under the 512 MB ceiling, and the pinned
# SOLVER_MAX_CONCURRENT=1 keeps a burst from stacking solves into that ceiling.
# Fine for light portfolio traffic. To upgrade later: set `plan` to `standard`
# (1 vCPU / 2 GB, ~$25/mo) here or in the Render dashboard -- no code change.
services:
  - type: web
    name: river-solver
    runtime: docker
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Pin concurrency: Render containers can SEE more cores than the vCPU you
      # are allocated, so the cpu-count default in config.py would oversubscribe.
      # Each solve is BLAS-capped to 1 core, so 1 concurrent solve per vCPU.
      - key: SOLVER_MAX_CONCURRENT
        value: "1"          # 1 per vCPU; keep at 1 on starter (0.5 vCPU)
      # The rest inherit config.py defaults; override here to tune without a redeploy.
      - key: SOLVER_MAX_ITERS
        value: "1500"
      - key: SOLVER_TIMEOUT_S
        value: "60"
      - key: SOLVER_MAX_TREE_NODES
        value: "5000"
      - key: SOLVER_RATE_LIMIT
        value: "10 per minute"
