<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>River Solver</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>River Solver</h1>
    <p class="sub">Heads-up no-limit river subgame &middot; vectorized CFR+</p>
  </header>

  <main>
    <!-- Board -->
    <section class="panel">
      <h2>Board <span id="board-hint" class="hint">pick 5</span></h2>
      <div class="street-toggle">
        <label><input type="radio" name="street" value="river" checked> River — 5 cards</label>
        <label class="wip" title="not ready yet"><input type="radio" name="street" value="turn" disabled> Turn — work in progress</label>
      </div>
      <div id="board-slots" class="board-slots"></div>
      <div id="card-picker" class="card-picker"></div>
    </section>

    <!-- Ranges -->
    <section class="panel">
      <h2>Ranges</h2>
      <div class="weight-row">
        <label>Hand weight: <span id="weight-label">100%</span></label>
        <input type="range" id="weight" min="0" max="100" value="100" />
      </div>
      <div class="ranges">
        <div class="range-block">
          <div class="range-head"><span class="dot p0"></span> P0 &middot; out of position
            <button class="clear" data-player="0">clear</button></div>
          <div id="grid-0" class="range-grid"></div>
        </div>
        <div class="range-block">
          <div class="range-head"><span class="dot p1"></span> P1 &middot; in position
            <button class="clear" data-player="1">clear</button></div>
          <div id="grid-1" class="range-grid"></div>
        </div>
      </div>
    </section>

    <!-- Controls -->
    <section class="panel controls">
      <div class="control-line">
        <label>Pot <input type="number" id="pot" value="20" min="1" /></label>
        <label>Stack <input type="number" id="stack" value="80" min="1" /></label>
        <label>Iterations <input type="number" id="iters" value="1000" min="20" max="3000" step="10" /></label>
        <button id="solve" class="solve">Solve</button>
        <button id="stop" class="solve btn-stop" disabled>Stop</button>
        <button id="resume" class="solve btn-resume" disabled>Resume</button>
        <span id="status" class="status"></span>
      </div>
      <div class="control-line sizes-control">
        <div class="sizes-row">
          <label for="nsizes">Bet sizes (% pot)</label>
          <span class="slider-group">
            <input type="range" id="nsizes" class="nsize-slider" min="1" max="5" value="3" step="1" />
            <span id="nsizes-count" class="nsize-count">3</span>
          </span>
          <span class="betsizes">
            <input type="number" class="betsize" value="33" min="5" max="300" step="1" />
            <input type="number" class="betsize" value="66" min="5" max="300" step="1" />
            <input type="number" class="betsize" value="100" min="5" max="300" step="1" />
            <input type="number" class="betsize" value="150" min="5" max="300" step="1" />
            <input type="number" class="betsize" value="200" min="5" max="300" step="1" />
          </span>
        </div>
        <div id="sizes-warn" class="warn">⚠ 4–5 bet sizes enlarge the game tree and can slow solves noticeably.</div>
      </div>
    </section>

    <!-- Results -->
    <section class="panel" id="results" hidden>
      <h2 class="result-head"><span>Result</span><span id="expl" class="expl"></span></h2>
      <div id="legend" class="legend"></div>
      <div class="range-block">
        <div class="range-head">P0 strategy (acting player) — click a hand for its combos</div>
        <div id="grid-result" class="range-grid"></div>
      </div>
      <div id="combo-view" class="combo-view" hidden></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
